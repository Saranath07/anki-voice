openapi: 3.0.3
info:
  title: Anki Voice Flask Backend API
  description: |
    A Flask-based REST API backend for the Anki Voice application, providing endpoints for flashcard generation, 
    answer evaluation, text-to-speech, speech-to-text, and Anki integration.
  version: 1.0.0
  contact:
    name: Anki Voice API
servers:
  - url: http://localhost:5001/api
    description: Development server

paths:
  /health:
    get:
      summary: Health Check
      description: Check the health status of the API and AnkiConnect connection
      tags:
        - System
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  timestamp:
                    type: string
                    format: date-time
                    example: "2025-06-15T04:25:17.421930"
                  anki_connect_available:
                    type: boolean
                    example: true

  /decks:
    get:
      summary: Get Available Decks
      description: Retrieve list of available Anki decks
      tags:
        - Anki
      responses:
        '200':
          description: Successfully retrieved deck list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  decks:
                    type: array
                    items:
                      type: string
                    example: ["Deep Learning", "Default"]
        '500':
          description: Error retrieving decks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /generate_flashcards_with_llm:
    post:
      summary: Generate Flashcards with LLM
      description: Generate flashcards from a given statement using Large Language Model
      tags:
        - LLM
        - Flashcards
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - statement
              properties:
                statement:
                  type: string
                  description: The statement/theorem/fact to generate flashcards from
                  example: "The Pythagorean theorem states that in a right triangle, the square of the hypotenuse equals the sum of squares of the other two sides."
      responses:
        '200':
          description: Successfully generated flashcards
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    example: 4
                  flashcards:
                    type: array
                    items:
                      $ref: '#/components/schemas/Flashcard'
        '400':
          description: Missing or invalid statement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: LLM generation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /evaluate_answer_with_llm:
    post:
      summary: Evaluate Answer with LLM
      description: Use LLM to evaluate user's answer and provide rating with emotional feedback
      tags:
        - LLM
        - Evaluation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - question
                - correct_answer
                - user_answer
              properties:
                question:
                  type: string
                  description: The question that was asked
                  example: "What is the capital of France?"
                correct_answer:
                  type: string
                  description: The correct answer
                  example: "Paris"
                user_answer:
                  type: string
                  description: The user's provided answer
                  example: "Paris is the capital city"
      responses:
        '200':
          description: Successfully evaluated answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  rating:
                    type: integer
                    minimum: 1
                    maximum: 4
                    description: "Rating scale: 1=Again, 2=Hard, 3=Good, 4=Easy"
                    example: 4
                  explanation:
                    type: string
                    description: Detailed evaluation with emotional feedback
                    example: "Rating: 4\nReason: The user's answer is correct and accurately conveys the main idea that Paris is indeed the capital of France."
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: LLM evaluation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /read_question:
    post:
      summary: Text-to-Speech for Questions
      description: Convert question text to speech and return audio file
      tags:
        - TTS
        - Audio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - question
              properties:
                question:
                  type: string
                  description: The question text to convert to speech
                  example: "What is the square root of 16?"
                enhance:
                  type: boolean
                  description: Whether to enhance the question with natural speech elements using LLM
                  default: false
                  example: true
      responses:
        '200':
          description: Successfully generated audio file
          content:
            audio/wav:
              schema:
                type: string
                format: binary
                description: WAV audio file containing the spoken question
        '400':
          description: Missing question text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Audio generation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /record_answer:
    post:
      summary: Speech-to-Text for Answers
      description: Convert uploaded audio file to text using speech recognition
      tags:
        - ASR
        - Audio
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - audio
              properties:
                audio:
                  type: string
                  format: binary
                  description: Audio file containing the user's spoken answer (WAV format recommended)
      responses:
        '200':
          description: Successfully transcribed audio
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  text:
                    type: string
                    description: Transcribed text from the audio
                    example: "The answer is forty-two"
        '400':
          description: Missing audio file or could not understand audio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Speech recognition error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /change_of_modes:
    post:
      summary: Change Application Mode
      description: Handle mode changes for the application
      tags:
        - System
        - Modes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mode
              properties:
                mode:
                  type: string
                  enum:
                    - add_cards
                    - review_cards
                    - deck_stats
                    - tts_only
                    - asr_llm
                    - enhanced_tts_asr_llm
                  description: The mode to switch to
                  example: "review_cards"
      responses:
        '200':
          description: Successfully changed mode
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  mode:
                    type: string
                    example: "review_cards"
                  description:
                    type: string
                    example: "Review existing flashcards"
        '400':
          description: Invalid or missing mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Mode change error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /deck_stats:
    get:
      summary: Get Deck Statistics
      description: Retrieve statistics for a specified Anki deck
      tags:
        - Anki
        - Statistics
      parameters:
        - name: deck_name
          in: query
          required: true
          schema:
            type: string
          description: Name of the deck to get statistics for
          example: "Deep Learning"
      responses:
        '200':
          description: Successfully retrieved deck statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  deck_name:
                    type: string
                    example: "Deep Learning"
                  stats:
                    $ref: '#/components/schemas/DeckStats'
        '400':
          description: Missing deck_name parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error retrieving deck statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /send_question_answer:
    post:
      summary: Log Question-Answer Data
      description: Send question and answer data for logging or processing
      tags:
        - Logging
        - Analytics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                  description: The question that was asked
                  example: "What is 2 + 2?"
                answer:
                  type: string
                  description: The correct answer
                  example: "4"
                user_answer:
                  type: string
                  description: The user's provided answer
                  example: "Four"
                rating:
                  type: integer
                  minimum: 1
                  maximum: 4
                  description: The rating given to the user's answer
                  example: 4
                timestamp:
                  type: string
                  format: date-time
                  description: Timestamp of the interaction (optional, defaults to current time)
                  example: "2025-06-15T04:27:15.159230"
                deck_name:
                  type: string
                  description: Name of the deck the card belongs to
                  example: "Math"
                card_id:
                  type: string
                  description: Unique identifier for the card
                  example: "12345"
      responses:
        '200':
          description: Successfully logged data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Question-answer data received and logged"
                  logged_data:
                    $ref: '#/components/schemas/LogEntry'
        '400':
          description: Missing request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Logging error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Flashcard:
      type: object
      properties:
        Front:
          type: string
          description: The question side of the flashcard
          example: "What is the capital of France?"
        Back:
          type: string
          description: The answer side of the flashcard
          example: "Paris"
      required:
        - Front
        - Back

    DeckStats:
      type: object
      properties:
        total_in_deck:
          type: integer
          description: Total number of cards in the deck
          example: 0
        new_count:
          type: integer
          description: Number of new cards
          example: 0
        learn_count:
          type: integer
          description: Number of cards in learning phase
          example: 0
        review_count:
          type: integer
          description: Number of cards due for review
          example: 0
        due_cards:
          type: integer
          description: Number of cards currently due
          example: 0
        new_cards:
          type: integer
          description: Number of new cards available
          example: 1
        total_cards:
          type: integer
          description: Total number of cards found
          example: 4

    LogEntry:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2025-06-15T04:27:15.159230"
        deck_name:
          type: string
          example: "Math"
        card_id:
          type: string
          example: "12345"
        question:
          type: string
          example: "What is 2 + 2?"
        correct_answer:
          type: string
          example: "4"
        user_answer:
          type: string
          example: "Four"
        rating:
          type: integer
          minimum: 1
          maximum: 4
          example: 4

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message describing what went wrong
          example: "Statement is required"

tags:
  - name: System
    description: System health and configuration endpoints
  - name: Anki
    description: Anki integration endpoints
  - name: LLM
    description: Large Language Model integration endpoints
  - name: Flashcards
    description: Flashcard generation and management
  - name: Evaluation
    description: Answer evaluation and feedback
  - name: TTS
    description: Text-to-Speech functionality
  - name: ASR
    description: Automatic Speech Recognition functionality
  - name: Audio
    description: Audio processing endpoints
  - name: Modes
    description: Application mode management
  - name: Statistics
    description: Statistics and analytics endpoints
  - name: Logging
    description: Data logging and tracking endpoints
  - name: Analytics
    description: Analytics and user interaction tracking